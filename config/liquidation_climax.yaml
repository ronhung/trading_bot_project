# ================================================================
# Strategy 3: Liquidation Climax Fading (Mean Reversion)
# ================================================================
# Trigger: LiquidationClimaxTrigger (Trades Count Spike + VWAP Dev + Flow Reversal)
# Regime Filter: Active only when ATR <= 40th percentile of 24h
# Microstructure Data: 3-Year Binance USD-M Futures aggTrades (2021-2023)
# Barrier: TripleBarrierLabeler (2.0% TP / 1.0% SL / 120 bars max hold)
# Sizing: FixedRiskSizer (1.2% risk, max_leverage 6.0)
# Execution: Hybrid Maker Entry (Post-Only 0.02%) + Limit TP / Market SL
# Risk Manager: MaxDrawdownRiskManager (max_dd 20%)
# ================================================================

strategy:
  name: "liquidation_climax"
  version: "1.1"
  symbol: "BTCUSDT"

data:
  source: "data/historical_data/BTCUSDT_1m_microstructure_3yr.parquet"
  train_range: ["2021-01-01", "2023-01-01"]
  test_range:  ["2023-01-01", "2023-12-31"]

trigger:
  type: "research.triggers.liquidation_climax.LiquidationClimaxTrigger"
  params:
    trades_window: 120
    trades_std_mult: 3.2
    deviation_mult: 2.5
    atr_period: 60
    ofi_window: 5
    cooldown: 120
    regime_filter: true
    regime_window: 1440
    regime_quantile: 0.40
    allow_long: true
    allow_short: true

indicators:
  entry_period: 120
  exit_period: 60
  atr_period: 60
  vol_period: 60
  ma_period: 1440

features:
  - type: "research.features.ATRFeature"
  - type: "research.features.VolumeRatioFeature"
  - type: "research.features.TakerFlowFeature"
  - type: "research.features.LaggedReturnsFeature"

labeler:
  type: "research.labeling.TripleBarrierLabeler"
  params:
    upper_barrier: 0.020
    lower_barrier: -0.010
    horizon: 120

sizing:
  type: "fixed_risk"
  risk_pct: 0.012
  max_leverage: 6.0

risk:
  type: "max_drawdown"
  max_dd_pct: 0.20

execution:
  entry:
    order_type: "limit_post_only"
    timeout_bars: 2
  exit:
    tp_order_type: "limit"
    sl_order_type: "market"
  maker_commission: 0.0002
  taker_commission: 0.0005
