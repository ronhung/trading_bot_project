# ================================================================
# Strategy 2: Liquidity Absorption & Divergence (Iceberg Detection)
# ================================================================
# Trigger: AbsorptionDivergenceTrigger (Volume Surge + Taker Flow + Stagnation)
# Regime Filter: Active only during range regime (ATR <= 35th percentile of 24h)
# Microstructure Data: 3-Year Binance USD-M Futures aggTrades (2021-2023)
# Barrier: TripleBarrierLabeler (1.8% TP / 0.9% SL / 120 bars max hold)
# Sizing: FixedRiskSizer (1.2% risk, max_leverage 6.0)
# Execution: Hybrid Maker Entry (Post-Only 0.02%) + Limit TP / Market SL
# Risk Manager: MaxDrawdownRiskManager (max_dd 20%)
# ================================================================

strategy:
  name: "absorption_divergence"
  version: "1.1"
  symbol: "BTCUSDT"

data:
  source: "data/historical_data/BTCUSDT_1m_microstructure_3yr.parquet"
  train_range: ["2021-01-01", "2023-01-01"]
  test_range:  ["2023-01-01", "2023-12-31"]

trigger:
  type: "research.triggers.absorption_divergence.AbsorptionDivergenceTrigger"
  params:
    vol_window: 60
    vol_mult: 3.2
    taker_high: 0.75
    taker_low: 0.25
    absorption_ratio: 0.15
    atr_period: 60
    cooldown: 120
    regime_filter: true
    regime_window: 1440
    regime_quantile: 0.35
    allow_long: true
    allow_short: true

indicators:
  entry_period: 120
  exit_period: 60
  atr_period: 60
  vol_period: 60
  ma_period: 1440

features:
  - type: "research.features.ATRFeature"
  - type: "research.features.VolumeRatioFeature"
  - type: "research.features.TakerFlowFeature"
  - type: "research.features.LaggedReturnsFeature"

labeler:
  type: "research.labeling.TripleBarrierLabeler"
  params:
    upper_barrier: 0.018
    lower_barrier: -0.009
    horizon: 120

sizing:
  type: "fixed_risk"
  risk_pct: 0.012
  max_leverage: 6.0

risk:
  type: "max_drawdown"
  max_dd_pct: 0.20

execution:
  entry:
    order_type: "limit_post_only"
    timeout_bars: 2
  exit:
    tp_order_type: "limit"
    sl_order_type: "market"
  maker_commission: 0.0002
  taker_commission: 0.0005
