# ================================================================
# Strategy 4: Dynamic VWAP Band Reversion
# ================================================================
# Trigger: DynamicVWAPBandTrigger (Rolling VWAP Bands + OFI Rejection Confirmation)
# Regime Filter: Active only when ATR <= 35th percentile of 24h
# Microstructure Data: 3-Year Binance USD-M Futures aggTrades (2021-2023)
# Barrier: TripleBarrierLabeler (1.6% TP / 1.0% SL / 90 bars max hold)
# Sizing: FixedRiskSizer (1.2% risk, max_leverage 6.0)
# Execution: Hybrid Maker Entry (Post-Only 0.02%) + Limit TP / Market SL
# Risk Manager: MaxDrawdownRiskManager (max_dd 20%)
# ================================================================

strategy:
  name: "dynamic_vwap_band"
  version: "1.1"
  symbol: "BTCUSDT"

data:
  source: "data/historical_data/BTCUSDT_1m_microstructure_3yr.parquet"
  train_range: ["2021-01-01", "2023-01-01"]
  test_range:  ["2023-01-01", "2023-12-31"]

trigger:
  type: "research.triggers.dynamic_vwap_band.DynamicVWAPBandTrigger"
  params:
    vwap_window: 240
    band_mult: 2.3
    ofi_window: 15
    ofi_threshold: 0.025
    cooldown: 120
    regime_filter: true
    regime_window: 1440
    regime_quantile: 0.35
    allow_long: true
    allow_short: true

indicators:
  entry_period: 240
  exit_period: 90
  atr_period: 120
  vol_period: 240
  ma_period: 1440

features:
  - type: "research.features.ATRFeature"
  - type: "research.features.VolumeRatioFeature"
  - type: "research.features.TakerFlowFeature"
  - type: "research.features.TrendFilterFeature"

labeler:
  type: "research.labeling.TripleBarrierLabeler"
  params:
    upper_barrier: 0.016
    lower_barrier: -0.010
    horizon: 90

sizing:
  type: "fixed_risk"
  risk_pct: 0.012
  max_leverage: 6.0

risk:
  type: "max_drawdown"
  max_dd_pct: 0.20

execution:
  entry:
    order_type: "limit_post_only"
    timeout_bars: 2
  exit:
    tp_order_type: "limit"
    sl_order_type: "market"
  maker_commission: 0.0002
  taker_commission: 0.0005
