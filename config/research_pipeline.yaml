# Research Pipeline Configuration
# Phase 1-3: Trigger → Features → Labeler → Dataset → Model → Evaluation
#
# Add a new alpha by changing ONLY this file — runner code is never modified.

strategy:
  name: "turtle_vol_filter"
  version: "1.0"

data:
  source: "data/historical_data/BTCUSDT_1m_full.parquet"
  # Out-of-sample split: train 2020-2023, test 2024 (no chronological overlap)
  train_range: ["2020-01-01", "2024-01-01"]
  test_range:  ["2024-01-01", "2025-01-01"]

trigger:
  type: "research.triggers.turtle_breakout.TurtleBreakoutTrigger"
  params:
    entry_period: 28800      # 20-day at 1m
    atr_period: 28800
    atr_mult: 4.0
    intensity_threshold: 1.0    # Phase 3b: 1.0 beats 0.5 (filters weak breakouts)
    signed: true

# Single source of truth for indicator periods. Feature classes are pure
# readers — they extract values from these precomputed columns, so ALL
# lookback periods live here (and must match the trigger).
indicators:
  entry_period: 28800       # 20-day Donchian channel (match trigger)
  exit_period: 14400        # 10-day exit channel
  atr_period: 28800         # 20-day ATR (match trigger)
  vol_period: 1440          # 1-day volume MA
  ma_period: 288000         # 200-day trend MA

features:
  - type: "research.features.ATRFeature"
  - type: "research.features.BreakoutIntensityFeature"
  - type: "research.features.VolumeRatioFeature"
  - type: "research.features.ChannelPositionFeature"
  - type: "research.features.DonchianWidthFeature"
  - type: "research.features.LaggedReturnsFeature"
  - type: "research.features.TakerFlowFeature"
  - type: "research.features.TrendFilterFeature"

labeler:
  type: "research.labeling.FixedHorizonLabeler"
  params:
    horizon: 14400           # 10-day forward return at 1m

model:
  type: "xgboost"
  target: "y_norm"
  output_prefix: "turtle_vol_filter"
  train_split: 0.8
  cv_folds: 5
  params:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.8
    objective: "reg:squarederror"
    random_state: 42
