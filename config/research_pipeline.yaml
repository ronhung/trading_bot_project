# Research Pipeline Configuration
# Phase 1-3: Trigger → Features → Labeler → Dataset → Model → Evaluation
#
# Add a new alpha by changing ONLY this file — runner code is never modified.

strategy:
  name: "turtle_vol_filter"
  version: "1.0"

data:
  source: "data/historical_data/BTCUSDT_1m_full.parquet"
  date_range: ["2020-01-01", "2024-01-01"]

trigger:
  type: "research.triggers.turtle_breakout.TurtleBreakoutTrigger"
  params:
    entry_period: 28800      # 20-day at 1m
    atr_period: 28800
    atr_mult: 4.0
    intensity_threshold: 0.5
    signed: true

features:
  - type: "research.features.ATRFeature"
    params: { period: 20 }
  - type: "research.features.BreakoutIntensityFeature"
    params: { entry_period: 28800, atr_period: 28800 }
  - type: "research.features.VolumeRatioFeature"
    params: { vol_period: 20 }
  - type: "research.features.ChannelPositionFeature"
    params: { entry_period: 28800 }
  - type: "research.features.DonchianWidthFeature"
    params: { entry_period: 28800 }
  - type: "research.features.LaggedReturnsFeature"
    params: { periods: [5, 10, 30] }
  - type: "research.features.TakerFlowFeature"
    params: { period: 20 }
  - type: "research.features.TrendFilterFeature"
    params: { ma_period: 200 }

labeler:
  type: "research.labeling.FixedHorizonLabeler"
  params:
    horizon: 14400           # 10-day forward return at 1m

model:
  type: "xgboost"
  target: "y_norm"
  output_prefix: "turtle_vol_filter"
  train_split: 0.8
  cv_folds: 5
  params:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.8
    objective: "reg:squarederror"
    random_state: 42
